<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aspect Test</title>
  <style>
    body { background: #18181b; color: #fff; font-family: monospace; padding: 20px; display: flex; gap: 30px; }
    .box { border: 1px dashed red; }
  </style>
</head>
<body>
  <div>
    <h3>Square 128x128 ViewBox (Y: 100 to 228)</h3>
    <svg width="64" height="64" viewBox="0 100 128 128" class="box">
      <image href="/assets/panda-roll.png" width="1024" height="341" />
    </svg>
  </div>

  <div>
    <h3>Full Frame 128x341 ViewBox</h3>
    <svg width="64" height="170" viewBox="0 0 128 341" class="box">
      <image href="/assets/panda-roll.png" width="1024" height="341" />
    </svg>
  </div>

  <div>
    <h3>Tight Bounding Box 128x245 ViewBox (Y: 62 to 307)</h3>
    <svg width="64" height="122" viewBox="0 62 128 245" class="box">
      <image href="/assets/panda-roll.png" width="1024" height="341" />
    </svg>
  </div>
</body>
</html>
